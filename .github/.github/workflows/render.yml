name: Render Faceless Short

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Chrome, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable ffmpeg

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy kokoro-onnx faster-whisper

      - name: Download Kokoro voice model
        run: |
          python -c "from kokoro_onnx import download_models; download_models()"

      - name: Download Whisper model
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Generate narration + word timings
        working-directory: ./eiffel-con
        run: |
          python ../../skills/faceless-shorts/scripts/voice.py .
          python ../../skills/faceless-shorts/scripts/words.py .

      - name: Validate shots
        working-directory: ./eiffel-con
        run: |
          node tools/capture.mjs check

      - name: Generate sound cues
        working-directory: ./eiffel-con
        run: |
          node tools/capture.mjs cues

      - name: Mix audio
        working-directory: ./eiffel-con
        run: |
          python tools/mix.py .

      - name: Render video
        working-directory: ./eiffel-con
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          node tools/capture.mjs video renders/eiffel-con.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiffel-con-video
          path: eiffel-con/renders/eiffel-con.mp4
          retention-days: 7
